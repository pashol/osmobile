plugins { id 'com.android.application' }
android {
    namespace 'org.openom.app'
    compileSdk 36
    defaultConfig {
        applicationId 'org.openom.app'
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    sourceSets.main.assets.srcDirs += ['../licenses']
}
dependencies { implementation project(':ble') }
